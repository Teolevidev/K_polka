<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    a { color: #96412C; text-decoration: none; }
    a:hover { color: #7A3524; }
    h1, h2, h3 { font-family: 'Lora', Georgia, serif; margin: 0; text-wrap: balance; }
    p { margin: 0; }
  </style>
</helmet>

<div style="background: {{paper}}; color: #2A2622; min-height: 100%;">

  <!-- Шапка -->
  <div style="display: flex; align-items: center; gap: 16px; height: 64px; padding: 0 80px; border-bottom: 1px solid #E2DDD5; background: rgba(252,250,248,0.9);">
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{brand}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v18H5.5A1.5 1.5 0 0 1 4 19.5z"></path><path d="M9 3v18"></path>
      </svg>
      <span style="font-family: 'Lora', Georgia, serif; font-size: 19px; font-weight: 600; letter-spacing: -0.01em;">Книжная полка</span>
    </div>
    <div style="flex-grow: 1; display: flex; justify-content: center;">
      <div style="display: flex; align-items: center; gap: 8px; width: 100%; max-width: 420px; height: 36px; padding: 0 12px; border: 1px solid #E2DDD5; border-radius: 8px; background: #FFFFFF;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#746B63" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span style="font-size: 14px; color: #746B63;">Книги, авторы, люди</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 4px;">
      <span style="font-size: 14px; font-weight: 500; padding: 0 12px; color: {{brand}};">Цитаты</span>
      <span style="font-size: 14px; font-weight: 500; padding: 0 12px;">Обзор</span>
      <span style="font-size: 14px; font-weight: 500; padding: 0 12px;">Моя полка</span>
      <div style="width: 32px; height: 32px; border-radius: 999px; background: #EDE5D9; margin-left: 8px;"></div>
    </div>
  </div>

  <div style="padding: 40px 80px 56px;">

    <!-- Заголовок -->
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <h1 style="font-size: 34px; font-weight: 600; line-height: 1.25;">Цитаты</h1>
        <p style="font-size: 15px; color: #746B63;">То, что зацепило участников клуба</p>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 8px; background: {{brand}}; color: #FCFAF8; font-size: 14px; font-weight: 500;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FCFAF8" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        Добавить цитату
      </div>
    </div>

    <!-- Фильтры -->
    <div style="display: flex; align-items: center; gap: 10px; margin-top: 26px;">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; height: 34px; padding: 0 14px; border: 1px solid {{f.border}}; border-radius: 999px; background: {{f.bg}};">
          <span style="font-size: 14px; font-weight: 500; color: {{f.color}};">{{f.label}}</span>
        </div>
      </sc-for>
    </div>

    <!-- Сетка цитат -->
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 26px;">
      <sc-for list="{{quotes}}" as="q" hint-placeholder-count="9">
        <div style="background: #FFFFFF; border: 1px solid #E2DDD5; border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 16px;">

          <p style="font-family: 'Lora', Georgia, serif; font-size: {{q.size}}; line-height: 1.55; color: #2A2622;">{{q.text}}</p>

          <!-- Книга -->
          <div style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; background: #F8F5F0;">
            <div style="width: 28px; height: 42px; border-radius: 3px; background: {{q.bg}}; flex-shrink: 0;"></div>
            <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
              <span style="font-size: 13px; font-weight: 500; line-height: 1.3;">{{q.book}}</span>
              <span style="font-size: 12px; color: #746B63;">{{q.author}}, с. {{q.page}}</span>
            </div>
          </div>

          <!-- Автор выписки и реакции -->
          <div style="display: flex; align-items: center; gap: 9px;">
            <div style="width: 26px; height: 26px; border-radius: 999px; background: #EDE5D9;"></div>
            <span style="font-size: 13px; color: #746B63;">{{q.by}}</span>
            <div style="display: flex; align-items: center; gap: 14px; margin-left: auto;">
              <div style="display: flex; align-items: center; gap: 5px;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#746B63" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.5 2.5-3.2 2.5-5A5.5 5.5 0 0 0 12 5.5 5.5 5.5 0 0 0 2.5 9c0 1.8 1 3.5 2.5 5l7 7z"></path></svg>
                <span style="font-size: 13px; color: #746B63;">{{q.likes}}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 5px;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#746B63" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"></path></svg>
                <span style="font-size: 13px; color: #746B63;">{{q.comments}}</span>
              </div>
            </div>
          </div>

        </div>
      </sc-for>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "brand": {"editor": "color", "default": "#96412C", "options": ["#96412C", "#3F5C4A", "#2F4858", "#6B4E7A"], "section": "Цвета"},
  "paper": {"editor": "color", "default": "#FCFAF8", "options": ["#FCFAF8", "#F8F8F8", "#FAF7F0", "#FFFFFF"], "section": "Цвета"}
}'>
class Component extends DCLogic {
  renderVals() {
    const brand = this.props.brand ?? '#96412C';
    return {
      brand: brand,
      paper: this.props.paper ?? '#FCFAF8',
      filters: [
        { label: 'Все',            bg: brand,     border: brand,     color: '#FCFAF8' },
        { label: 'Мои',            bg: '#FFFFFF', border: '#E2DDD5', color: '#2A2622' },
        { label: 'Книга месяца',   bg: '#FFFFFF', border: '#E2DDD5', color: '#2A2622' },
        { label: 'С обсуждением',  bg: '#FFFFFF', border: '#E2DDD5', color: '#2A2622' }
      ],
      quotes: [
        { text: 'Время дано нам по милосердию Божию, чтобы мы не запутались, ибо сознание человека не может вместить всех событий одновременно.',
          book: 'Лавр', author: 'Водолазкин', page: '212', by: 'Марина', bg: '#2F4858', likes: '6', comments: '2', size: '17px' },
        { text: 'Я не боюсь. Страх убивает разум. Страх есть малая смерть, влекущая за собой полное уничтожение.',
          book: 'Дюна', author: 'Герберт', page: '19', by: 'Тео', bg: '#C08A3E', likes: '9', comments: '4', size: '18px' },
        { text: 'Счастье это когда тебя понимают, большое счастье это когда тебя любят, настоящее счастье это когда любишь ты.',
          book: 'Пикник на обочине', author: 'Стругацкие', page: '134', by: 'Антон', bg: '#5C5140', likes: '4', comments: '1', size: '17px' },
        { text: 'Никогда не поймешь человека, пока не влезешь в его шкуру и не походишь в ней.',
          book: 'Убить пересмешника', author: 'Ли', page: '38', by: 'Ольга', bg: '#A8632F', likes: '7', comments: '3', size: '18px' },
        { text: 'Любая встреча больше, чем расставание. До встречи существует пустота, а после расставания остается память.',
          book: 'Лавр', author: 'Водолазкин', page: '318', by: 'Тео', bg: '#2F4858', likes: '5', comments: '0', size: '17px' },
        { text: 'Смерть настолько же неизбежна, насколько и невероятна.',
          book: 'Щегол', author: 'Тартт', page: '502', by: 'Марина', bg: '#D8CFC0', likes: '3', comments: '1', size: '19px' },
        { text: 'Мы живем в мире, где похороны важнее покойника, свадьба важнее любви, а внешность важнее ума.',
          book: 'Сто лет одиночества', author: 'Маркес', page: '271', by: 'Ольга', bg: '#7A3524', likes: '8', comments: '5', size: '17px' },
        { text: 'Внешнее движение не всегда обязательно. Иногда полезнее оставаться на месте и двигаться внутрь.',
          book: 'Лавр', author: 'Водолазкин', page: '96', by: 'Антон', bg: '#2F4858', likes: '5', comments: '2', size: '18px' },
        { text: 'Единственный способ избавиться от искушения поддаться ему.',
          book: 'Портрет Дориана Грея', author: 'Уайльд', page: '44', by: 'Марина', bg: '#4A4038', likes: '6', comments: '2', size: '19px' }
      ]
    };
  }
}
</script>
</body>
</html>
