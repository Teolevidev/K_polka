<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    a { color: #96412C; text-decoration: none; }
    a:hover { color: #7A3524; }
    h1, h2, h3 { font-family: 'Lora', Georgia, serif; margin: 0; text-wrap: balance; }
    p { margin: 0; }
  </style>
</helmet>

<div style="background: {{paper}}; color: #2A2622; min-height: 100%; display: flex; flex-direction: column;">

  <!-- Навигация -->
  <div style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; border-bottom: 1px solid #E2DDD5;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2A2622" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    <span style="font-size: 17px; font-weight: 600;">Новая цитата</span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 20px 16px;">

    <!-- Снимок страницы с выделением -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="position: relative; height: 244px; border-radius: 8px; background: #E8DFCE; overflow: hidden; display: flex; flex-direction: column; gap: 9px; padding: 26px 22px;">
        <sc-for list="{{pageLines}}" as="l" hint-placeholder-count="11">
          <div style="height: 7px; border-radius: 3px; background: {{l.tone}}; width: {{l.w}};"></div>
        </sc-for>
        <!-- Рамка распознанного фрагмента -->
        <div style="position: absolute; left: 14px; right: 14px; top: 92px; height: 82px; border: 2px solid {{brand}}; border-radius: 6px; background: rgba(150,65,44,0.10);"></div>
        <div style="position: absolute; left: 14px; top: 66px; display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 5px; background: {{brand}};">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FCFAF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
          <span style="font-size: 11px; font-weight: 600; color: #FCFAF8;">Распознано</span>
        </div>
      </div>
      <div style="display: flex; gap: 8px;">
        <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 7px; height: 38px; border-radius: 8px; border: 1px solid #E2DDD5; background: #FFFFFF; font-size: 14px; font-weight: 500;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2A2622" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
          Переснять
        </div>
        <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 7px; height: 38px; border-radius: 8px; border: 1px solid #E2DDD5; background: #FFFFFF; font-size: 14px; font-weight: 500;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2A2622" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.7L20 8"></path><path d="M20 4v4h-4"></path></svg>
          Выделить снова
        </div>
      </div>
    </div>

    <!-- Распознанный текст -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 12px; font-weight: 500; letter-spacing: 0.03em; text-transform: uppercase; color: #746B63;">Текст цитаты</span>
        <span style="font-size: 12px; color: #746B63;">можно поправить</span>
      </div>
      <div style="border: 1px solid #E2DDD5; border-radius: 8px; background: #FFFFFF; padding: 14px;">
        <p style="font-family: 'Lora', Georgia, serif; font-size: 16px; line-height: 1.55;">Время дано нам по милосердию Божию, чтобы мы не запутались, ибо сознание человека не может вместить всех событий одновременно.</p>
      </div>
    </div>

    <!-- Книга и страница -->
    <div style="display: flex; gap: 10px;">
      <div style="flex-grow: 1; display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 12px; border: 1px solid #E2DDD5; border-radius: 8px; background: #FFFFFF;">
        <div style="width: 26px; height: 39px; border-radius: 3px; background: #2F4858; flex-shrink: 0;"></div>
        <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
          <span style="font-size: 14px; font-weight: 500;">Лавр</span>
          <span style="font-size: 12px; color: #746B63;">Водолазкин</span>
        </div>
      </div>
      <div style="width: 88px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; height: 54px; border: 1px solid #E2DDD5; border-radius: 8px; background: #FFFFFF;">
        <span style="font-size: 11px; color: #746B63;">Страница</span>
        <span style="font-size: 15px; font-weight: 500;">212</span>
      </div>
    </div>

    <!-- Видимость -->
    <div style="display: flex; gap: 8px;">
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 7px; height: 40px; border: 1.5px solid {{brand}}; border-radius: 8px; background: #FBF6F3;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{brand}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9.5" cy="7" r="3.5"></circle><path d="M22 20v-2a4 4 0 0 0-3-3.85"></path></svg>
        <span style="font-size: 14px; font-weight: 500; color: {{brand}};">Клубу</span>
      </div>
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 7px; height: 40px; border: 1px solid #E2DDD5; border-radius: 8px; background: #FFFFFF;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2A2622" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
        <span style="font-size: 14px; font-weight: 500;">Только мне</span>
      </div>
    </div>

  </div>

  <!-- Сохранить -->
  <div style="padding: 12px 16px 24px; border-top: 1px solid #E2DDD5; background: #FBFAF8;">
    <div style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 8px; background: {{brand}}; color: #FCFAF8; font-size: 16px; font-weight: 500;">Сохранить цитату</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{
  "brand": {"editor": "color", "default": "#96412C", "options": ["#96412C", "#3F5C4A", "#2F4858", "#6B4E7A"], "section": "Цвета"},
  "paper": {"editor": "color", "default": "#FCFAF8", "options": ["#FCFAF8", "#F8F8F8", "#FAF7F0", "#FFFFFF"], "section": "Цвета"}
}'>
class Component extends DCLogic {
  renderVals() {
    return {
      brand: this.props.brand ?? '#96412C',
      paper: this.props.paper ?? '#FCFAF8',
      pageLines: [
        { w: '96%', tone: '#BFB29A' },
        { w: '88%', tone: '#BFB29A' },
        { w: '92%', tone: '#BFB29A' },
        { w: '70%', tone: '#BFB29A' },
        { w: '94%', tone: '#8C7F68' },
        { w: '90%', tone: '#8C7F68' },
        { w: '78%', tone: '#8C7F68' },
        { w: '93%', tone: '#BFB29A' },
        { w: '86%', tone: '#BFB29A' },
        { w: '91%', tone: '#BFB29A' },
        { w: '54%', tone: '#BFB29A' }
      ]
    };
  }
}
</script>
</body>
</html>
